worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format sandbox '$time_iso8601 | $status | ${request_time}s | $upstream_addr | $request';
    access_log /var/log/nginx/access.log sandbox;
    error_log  /var/log/nginx/error.log  warn;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    server {
        listen 80 default_server;

        # Docker's internal DNS — resolves container names at request time
        resolver 127.0.0.11 valid=30s;

        # Platform health check
        location /health {
            return 200 '{"status":"ok","service":"devops-sandbox"}';
            add_header Content-Type application/json always;
        }

        # Per-environment location blocks — included dynamically
        include /etc/nginx/conf.d/*.conf;

        # Catch-all — no env matched
        location / {
            return 404 '{"error":"No environment found at this path"}';
            add_header Content-Type application/json always;
        }
    }
}
